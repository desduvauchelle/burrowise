[package]
name = "second-brain-desktop"
version = "0.5.1"
description = "Local-first capture and knowledge desktop application"
authors = ["Burrowise contributors"]
edition = "2021"

[lib]
name = "second_brain_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.42", features = ["serde"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls"] }
notify = "8.2"
pathdiff = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-global-shortcut = "2.3.2"
thiserror = "2.0"
uuid = { version = "1.18", features = ["v4", "serde"] }
wait-timeout = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6.2"
objc2 = "0.6.4"
objc2-foundation = { version = "0.3.2", features = ["NSArray", "NSError", "NSLocale", "NSOperation", "NSString", "NSURL", "NSValue"] }
objc2-av-foundation = { version = "0.3.2", features = ["AVCaptureDevice", "AVMediaFormat"] }
objc2-speech = "0.3.2"

[dev-dependencies]
tempfile = "3.23"
